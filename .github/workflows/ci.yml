name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NOVA_TRADING_SUBSYSTEM_ENABLED: "false"
  NOVA_AUTO_EXECUTE: "false"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run test suite
        run: python -B -m pytest tests -q
