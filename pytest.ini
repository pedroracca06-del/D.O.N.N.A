[pytest]
# Deterministic discovery: a bare `pytest` collects the same set as
# `pytest tests`, so no run depends on the caller's working directory.
testpaths = tests

# No custom markers are registered here on purpose. As of this commit the suite
# uses only pytest built-ins (parametrize, skipif, usefixtures) and produces zero
# PytestUnknownMarkWarning. Legacy-execution tests are gated by the
# `legacy_trading_enabled` FIXTURE via
# `pytestmark = pytest.mark.usefixtures('legacy_trading_enabled')`, not by a
# marker. Add a `markers =` entry only when a real @pytest.mark.<name> appears.
